<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Letter Zap! Typing Adventure</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

  <!-- ============ HOME SCREEN ============ -->
  <section id="screen-home" class="screen active">
    <div class="home-card">
      <h1 class="game-title">⚡ Letter Zap! ⚡</h1>
      <p class="game-subtitle">A typing adventure for brand-new typists</p>
      <div class="home-mascot" aria-hidden="true">🤖</div>
      <div class="home-buttons">
        <button id="btn-start" class="big-btn primary">▶ Start Playing</button>
        <button id="btn-map" class="big-btn">🗺 Choose a Level</button>
        <button id="btn-garden" class="big-btn">🌼 Garden Mode</button>
        <button id="btn-tutorial" class="big-btn">📖 Home Row Lesson</button>
      </div>
      <button id="btn-sound-toggle" class="icon-btn" title="Toggle sound">🔊</button>
    </div>
  </section>

  <!-- ============ TUTORIAL SCREEN ============ -->
  <section id="screen-tutorial" class="screen">
    <div class="panel">
      <h2>Meet the Home Row! 🏠</h2>
      <div id="tutorial-steps"></div>
      <div class="panel-nav">
        <button id="tutorial-back" class="big-btn">⬅ Back</button>
        <button id="tutorial-next" class="big-btn primary">Next ➡</button>
      </div>
    </div>
  </section>

  <!-- ============ LEVEL MAP SCREEN ============ -->
  <section id="screen-map" class="screen">
    <div class="panel wide">
      <h2>Choose a Level 🗺</h2>
      <div id="map-list" class="map-list"></div>
      <button id="map-back" class="big-btn">⬅ Back to Home</button>
    </div>
  </section>

  <!-- ============ GARDEN MODE SCREEN ============ -->
  <section id="screen-garden" class="screen">
    <div id="garden-hud">
      <div class="hud-left">
        <button id="garden-back" class="hud-btn">⬅ Home</button>
      </div>
      <div class="hud-mid garden-meter-wrap">
        <div class="growth-meter"><div id="garden-meter-fill" class="growth-meter-fill"></div></div>
        <span id="garden-growth-text">0%</span>
      </div>
      <div class="hud-right">
        <span id="garden-words">🌼 0</span>
        <span id="garden-mistakes">✋ 0</span>
        <button id="garden-reset" class="hud-btn">🌱 New Garden</button>
      </div>
    </div>
    <div id="gardenArea">
      <div class="garden-sun" aria-hidden="true"></div>
      <div class="garden-cloud c1" aria-hidden="true">☁️</div>
      <div class="garden-cloud c2" aria-hidden="true">☁️</div>
      <div class="garden-vine left" aria-hidden="true">
        <svg viewBox="0 0 60 600" preserveAspectRatio="none">
          <rect x="23" y="0" width="14" height="600" rx="7" fill="#b5d98a"/>
          <rect x="20" y="70" width="20" height="8" rx="3" fill="#6a9b3f"/>
          <rect x="20" y="170" width="20" height="8" rx="3" fill="#6a9b3f"/>
          <rect x="20" y="270" width="20" height="8" rx="3" fill="#6a9b3f"/>
          <rect x="20" y="370" width="20" height="8" rx="3" fill="#6a9b3f"/>
          <rect x="20" y="470" width="20" height="8" rx="3" fill="#6a9b3f"/>
          <rect x="20" y="570" width="20" height="8" rx="3" fill="#6a9b3f"/>
          <path d="M30 100 Q 5 85 2 65 Q 25 75 30 100" fill="#8bc34a"/>
          <path d="M30 100 Q 55 85 58 65 Q 35 75 30 100" fill="#7cb342"/>
          <path d="M30 300 Q 5 285 2 265 Q 25 275 30 300" fill="#8bc34a"/>
          <path d="M30 300 Q 55 285 58 265 Q 35 275 30 300" fill="#7cb342"/>
          <path d="M30 480 Q 5 465 2 445 Q 25 455 30 480" fill="#8bc34a"/>
          <path d="M30 480 Q 55 465 58 445 Q 35 455 30 480" fill="#7cb342"/>
        </svg>
      </div>
      <div class="garden-vine right" aria-hidden="true">
        <svg viewBox="0 0 60 600" preserveAspectRatio="none">
          <rect x="23" y="0" width="14" height="600" rx="7" fill="#b5d98a"/>
          <rect x="20" y="40" width="20" height="8" rx="3" fill="#6a9b3f"/>
          <rect x="20" y="140" width="20" height="8" rx="3" fill="#6a9b3f"/>
          <rect x="20" y="240" width="20" height="8" rx="3" fill="#6a9b3f"/>
          <rect x="20" y="340" width="20" height="8" rx="3" fill="#6a9b3f"/>
          <rect x="20" y="440" width="20" height="8" rx="3" fill="#6a9b3f"/>
          <rect x="20" y="540" width="20" height="8" rx="3" fill="#6a9b3f"/>
          <path d="M30 190 Q 5 175 2 155 Q 25 165 30 190" fill="#8bc34a"/>
          <path d="M30 190 Q 55 175 58 155 Q 35 165 30 190" fill="#7cb342"/>
          <path d="M30 390 Q 5 375 2 355 Q 25 365 30 390" fill="#8bc34a"/>
          <path d="M30 390 Q 55 375 58 355 Q 35 365 30 390" fill="#7cb342"/>
          <path d="M30 550 Q 5 535 2 515 Q 25 525 30 550" fill="#8bc34a"/>
          <path d="M30 550 Q 55 535 58 515 Q 35 525 30 550" fill="#7cb342"/>
        </svg>
      </div>
      <div class="garden-deco d1" aria-hidden="true">🦋</div>
      <div class="garden-deco d2" aria-hidden="true">🐝</div>
      <div class="garden-deco corner tl" aria-hidden="true">🌸</div>
      <div class="garden-deco corner tr" aria-hidden="true">🎋</div>
      <div class="garden-deco corner bl" aria-hidden="true">⛩️</div>
      <div class="garden-deco corner br" aria-hidden="true">🏮</div>
      <div class="garden-hedge" aria-hidden="true"></div>
      <div class="garden-bush b1" aria-hidden="true"></div>
      <div class="garden-bush b2" aria-hidden="true"></div>
      <div class="garden-bush b3" aria-hidden="true"></div>
      <div class="garden-bush b4" aria-hidden="true"></div>
      <div class="garden-bush b5" aria-hidden="true"></div>
      <div id="gardenBanner" class="garden-banner hidden"></div>
      <div id="gardenLandmarks" class="garden-landmarks" aria-hidden="true"></div>
      <div id="gardenGrid" class="garden-grid"></div>
      <div id="gardenPrompt" class="garden-prompt"></div>
      <div class="garden-fence" aria-hidden="true"></div>
    </div>
  </section>

  <!-- ============ GAME SCREEN ============ -->
  <section id="screen-game" class="screen">
    <div id="hud">
      <div class="hud-left">
        <button id="game-back" class="hud-btn" title="Back to Home">⬅ Home</button>
        <span id="hud-stage-title">Stage</span>
      </div>
      <div class="hud-mid">
        <span id="hud-lives"></span>
        <label class="speed-control" title="Adjust how fast letters fall">
          🐢<input type="range" id="speed-slider" min="0.5" max="1.6" step="0.1" value="1">🐇
        </label>
      </div>
      <div class="hud-right">
        <span id="hud-score">⭐ 0</span>
        <span id="hud-accuracy">🎯 100%</span>
        <button id="btn-skip" class="hud-btn" title="Skip to next level">⏭ Skip</button>
        <button id="btn-pause" class="hud-btn" title="Pause">⏸</button>
      </div>
    </div>
    <div id="gameArea">
      <div id="cannon">🤖</div>
      <div id="targetHint"></div>
    </div>
  </section>

  <!-- ============ STAGE COMPLETE SCREEN ============ -->
  <section id="screen-complete" class="screen">
    <div class="panel">
      <h2 id="complete-title">Great Job!</h2>
      <div id="complete-stars" class="stars">⭐⭐⭐</div>
      <div id="complete-stats"></div>
      <div class="panel-nav">
        <button id="complete-retry" class="big-btn">🔁 Retry</button>
        <button id="complete-next" class="big-btn primary">Next ➡</button>
        <button id="complete-home" class="big-btn">🏠 Home</button>
      </div>
    </div>
  </section>

  <!-- ============ NEW KEY INTRO OVERLAY ============ -->
  <div id="overlay-keyintro" class="overlay hidden">
    <div class="overlay-card">
      <h2 id="keyintro-heading">New Key!</h2>
      <div id="keyintro-diagrams" class="keyintro-diagrams"></div>
      <p id="keyintro-text"></p>
      <button id="keyintro-ready" class="big-btn primary">Got it! Let's Go ➡</button>
    </div>
  </div>

  <!-- ============ PAUSE OVERLAY ============ -->
  <div id="overlay-pause" class="overlay hidden">
    <div class="overlay-card">
      <h2>Paused ⏸</h2>
      <button id="pause-resume" class="big-btn primary">▶ Resume</button>
      <button id="pause-quit" class="big-btn">🏠 Quit to Home</button>
    </div>
  </div>

</div>

<script src="js/fingerMap.js"></script>
<script src="js/wordlist.js"></script>
<script src="js/curriculum.js"></script>
<script src="js/storage.js"></script>
<script src="js/audio.js"></script>
<script src="js/game.js"></script>
<script src="js/garden.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
