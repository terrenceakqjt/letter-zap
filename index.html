<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Letter Zap! Typing Adventure</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

  <!-- ============ HOME SCREEN ============ -->
  <section id="screen-home" class="screen active">
    <div class="home-card">
      <h1 class="game-title">⚡ Letter Zap! ⚡</h1>
      <div class="home-mascot" aria-hidden="true">🤖</div>
      <p class="game-subtitle">How much typing have you done?</p>
      <div id="track-buttons" class="track-buttons"></div>
      <div class="home-divider"><span>or take it easy</span></div>
      <button id="btn-garden" class="big-btn track-btn garden">
        <span class="track-emoji">🌷</span>
        <span><span class="track-label">Garden Mode</span><span id="garden-btn-sub" class="track-sub">Grow a calm little garden, one word at a time</span></span>
      </button>
      <div class="home-extras">
        <button id="btn-map" class="big-btn small">🗺 Choose a Lesson</button>
        <button id="btn-tutorial" class="big-btn small">📖 Home Row Lesson</button>
      </div>
      <button id="btn-sound-toggle" class="icon-btn" title="Toggle sound">🔊</button>
    </div>
  </section>

  <!-- ============ TUTORIAL SCREEN ============ -->
  <section id="screen-tutorial" class="screen">
    <div class="panel">
      <h2>Meet the Home Row! 🏠</h2>
      <div id="tutorial-steps"></div>
      <div class="panel-nav">
        <button id="tutorial-back" class="big-btn">⬅ Back</button>
        <button id="tutorial-next" class="big-btn primary">Next ➡</button>
      </div>
    </div>
  </section>

  <!-- ============ LEVEL MAP SCREEN ============ -->
  <section id="screen-map" class="screen">
    <div class="panel wide">
      <h2>Choose a Lesson 🗺</h2>
      <div id="map-list" class="map-list"></div>
      <button id="map-back" class="big-btn">⬅ Back to Home</button>
    </div>
  </section>

  <!-- ============ GARDEN MODE SCREEN ============ -->
  <section id="screen-garden" class="screen">
    <div id="garden-hud">
      <div class="hud-left">
        <button id="garden-back" class="hud-btn">← Home</button>
      </div>
      <div class="hud-mid garden-meter-wrap">
        <span class="garden-stat-label">This garden</span>
        <div class="growth-meter"><div id="garden-meter-fill" class="growth-meter-fill"></div></div>
        <span id="garden-growth-text">0%</span>
      </div>
      <div class="hud-right">
        <span class="garden-stat"><span class="garden-stat-label">Words</span> <span id="garden-words">0</span></span>
        <span class="garden-stat"><span class="garden-stat-label">Mistakes</span> <span id="garden-mistakes">0</span></span>
        <span class="garden-stat garden-acc" title="Accuracy: how many of your key presses were correct"><span class="garden-stat-label">Accuracy</span> <span id="garden-accuracy">—</span>
          <button id="garden-acc-reset" class="garden-acc-reset" title="Reset accuracy">Reset</button></span>
        <button id="garden-reset" class="hud-btn">New garden</button>
      </div>
    </div>
    <div id="gardenArea">
      <div id="gardenBanner" class="garden-banner hidden"></div>
      <div id="gardenBoard" class="garden-board"></div>
      <div id="gardenPrompt" class="garden-prompt"></div>
    </div>
  </section>

  <!-- ============ GAME SCREEN ============ -->
  <section id="screen-game" class="screen">
    <div id="hud">
      <div class="hud-left">
        <button id="game-back" class="hud-btn" title="Back to Home">⬅ Home</button>
        <span id="hud-stage-title">Stage</span>
      </div>
      <div class="hud-mid">
        <span id="hud-lives"></span>
        <label class="speed-control" title="Adjust how fast the belt moves">
          🐢<input type="range" id="speed-slider" min="0.5" max="1.6" step="0.1" value="1">🐇
        </label>
      </div>
      <div class="hud-right">
        <span id="hud-score">⭐ 0</span>
        <span id="hud-accuracy">🎯 100%</span>
        <button id="btn-skip" class="hud-btn" title="Skip to next lesson">⏭ Skip</button>
        <button id="btn-pause" class="hud-btn" title="Pause">⏸</button>
      </div>
    </div>
    <div id="gameArea">
      <div class="restaurant" aria-hidden="true">
        <div class="noren"><span></span><span></span><span></span><span></span><span></span></div>
        <div class="lantern l1"></div><div class="lantern l2"></div>
        <div class="menu-boards">
          <div class="menu-tag">🍣<b>120</b></div><div class="menu-tag">🍤<b>150</b></div><div class="menu-tag">🍙<b>100</b></div>
          <div class="menu-tag">🍥<b>90</b></div><div class="menu-tag">🥟<b>130</b></div><div class="menu-tag">🍡<b>80</b></div>
        </div>
        <div class="shelf s1"><span>🍶</span><span>🫖</span><span>🍶</span></div>
        <div class="shelf s2"><span>🪴</span><span>🍵</span><span>🎋</span></div>
        <div class="counter">
          <div class="place-setting"><span class="cup">🍵</span><span class="sticks">🥢</span></div>
          <div class="place-setting"><span class="cup">🍵</span><span class="sticks">🥢</span></div>
          <div class="place-setting"><span class="cup">🍵</span><span class="sticks">🥢</span></div>
          <div class="place-setting"><span class="cup">🍵</span><span class="sticks">🥢</span></div>
          <div class="place-setting"><span class="cup">🍵</span><span class="sticks">🥢</span></div>
        </div>
      </div>
      <div id="chef" aria-hidden="true">👨‍🍳</div>
      <div id="cat" aria-hidden="true"><span class="cat-cushion"></span><span class="cat-face"></span><span class="cat-zzz">z<i>z</i><b>z</b></span><span class="cat-bubble">MRROWW!</span></div>
      <div id="targetHint"></div>
    </div>
  </section>

  <!-- ============ STAGE COMPLETE SCREEN ============ -->
  <section id="screen-complete" class="screen">
    <div class="panel">
      <h2 id="complete-title">Great Job!</h2>
      <div id="complete-stars" class="stars">⭐⭐⭐</div>
      <div id="complete-stats"></div>
      <div class="panel-nav">
        <button id="complete-retry" class="big-btn">🔁 Retry</button>
        <button id="complete-next" class="big-btn primary">Next ➡</button>
        <button id="complete-home" class="big-btn">🏠 Home</button>
      </div>
    </div>
  </section>

  <!-- ============ NEW KEY INTRO OVERLAY ============ -->
  <div id="overlay-keyintro" class="overlay hidden">
    <div class="overlay-card">
      <h2 id="keyintro-heading">New Key!</h2>
      <div id="keyintro-diagrams" class="keyintro-diagrams"></div>
      <p id="keyintro-text"></p>
      <button id="keyintro-ready" class="big-btn primary">Got it! Let's Go ➡</button>
    </div>
  </div>

  <!-- ============ PAUSE OVERLAY ============ -->
  <div id="overlay-pause" class="overlay hidden">
    <div class="overlay-card">
      <h2>Paused ⏸</h2>
      <button id="pause-resume" class="big-btn primary">▶ Resume</button>
      <button id="pause-quit" class="big-btn">🏠 Quit to Home</button>
    </div>
  </div>

</div>

<script src="js/fingerMap.js"></script>
<script src="js/wordlist.js"></script>
<script src="js/curriculum.js"></script>
<script src="js/storage.js"></script>
<script src="js/audio.js"></script>
<script src="js/game.js"></script>
<script src="js/gardenArt.js"></script>
<script src="js/garden.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
